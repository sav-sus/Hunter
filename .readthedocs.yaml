# Read the Docs build configuration.
#
# The generated pages (the rules reference and the worked example) are
# committed, so a docs build needs no dbt project and no manifest. It installs
# Hunter only because the theme and its extensions come with the site extra.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # Read the Docs clones shallowly, which is fine here: nothing in the
      # documentation build reads git history.
      - git fetch --unshallow || true

mkdocs:
  configuration: mkdocs.yml
  # Not strict: MkDocs treats a page present but absent from the navigation as
  # worth mentioning, and the example's per-table pages are deliberately absent
  # from it. The repository's own CI builds with --strict against the generated
  # output, which is where that check belongs.
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - site
    - requirements: docs/requirements.txt
