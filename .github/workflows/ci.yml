# Hunter's own CI. Three gates and the golden file, which is the one that
# catches an accidental change to a client's score.
name: Hunter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One Python, the one the project runs on. The package still declares 3.11 or
# newer, but CI tests what is used rather than every version it might run on.
env:
  PYTHON_VERSION: "3.12"

jobs:
  check:
    # Shown on a pull request as "Hunter / Tests and checks".
    name: Tests and checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --python ${{ env.PYTHON_VERSION }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

      - name: No client content in tracked files
        run: uv run python scripts/check_no_client_content.py

      - name: One version everywhere
        # Every action.yml installs Hunter from tag v<version>, so all six files
        # must agree and the version must be a release. This step never looks
        # at the remote: the release job below creates the tag and asserts it.
        # Making this step require the tag while the release job required this
        # step meant the tag could never be created.
        run: uv run python scripts/check_release.py

      - name: The golden file is current
        # A drifted golden file means someone changed the score without
        # reviewing the change. Section 11.9.
        run: |
          uv run python -m tests.regenerate_golden
          git diff --exit-code tests/golden/ || {
            echo "::error::The golden file is out of date. Run"\
                 "'uv run python -m tests.regenerate_golden' and review the diff."
            exit 1
          }

      - name: The generated documentation pages are current
        # The rules reference and the worked example are generated. A stale
        # rules reference is worse than none, because somebody will act on it.
        run: |
          uv run python scripts/build_docs_pages.py
          git diff --exit-code docs/ || {
            echo "::error::The generated documentation is out of date. Run"\
                 "'uv run python scripts/build_docs_pages.py' and commit the result."
            exit 1
          }

      - name: The documentation site builds
        run: uv run mkdocs build --site-dir /tmp/docsite

      - name: The committed HTML is current
        # docs-html/ is committed so the site can be opened from a checkout.
        # Rebuilding here keeps it from going stale silently.
        run: |
          uv run python scripts/build_docs_site.py --skip-regenerate
          git diff --exit-code docs-html/ || {
            echo "::error::The committed HTML is out of date. Run"\
                 "'uv run python scripts/build_docs_site.py' and commit the result."
            exit 1
          }

      - name: Hunter scores the example project end to end
        run: |
          uv run hunter score examples/tiny-shop --out /tmp/report.json
          uv run hunter align examples/tiny-shop
          uv run hunter explain wh_master__customer_dim examples/tiny-shop
          uv run hunter showcase examples/tiny-shop --days 14
          uv run hunter docs build examples/tiny-shop --out /tmp/site
          uv run hunter rules
          uv run hunter version

  release:
    # A release is a version bump that reaches main. This creates the tag the
    # actions install from, once, at the commit that carries the bump, then
    # asserts it exists. Later commits with the same version leave the tag
    # where it is: bump the version to release again.
    name: Tag the release
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --python ${{ env.PYTHON_VERSION }}

      - name: Create the tag for this version if it is missing, then check it
        run: uv run python scripts/check_release.py --release
