# Hunter's own CI. Three gates and the golden file, which is the one that
# catches an accidental change to a client's score.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

      - name: No client content in tracked files
        run: uv run python scripts/check_no_client_content.py

      - name: The golden file is current
        # A drifted golden file means someone changed the score without
        # reviewing the change. Section 11.9.
        run: |
          uv run python -m tests.regenerate_golden
          git diff --exit-code tests/golden/ || {
            echo "::error::The golden file is out of date. Run"\
                 "'uv run python -m tests.regenerate_golden' and review the diff."
            exit 1
          }

      - name: Hunter scores its own fixture end to end
        run: |
          uv run hunter score tests/fixtures/tiny-project --out /tmp/report.json
          uv run hunter align tests/fixtures/tiny-project
          uv run hunter docs build tests/fixtures/tiny-project --out /tmp/site
